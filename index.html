<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GridVault | Energía Inteligente</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        /* ==============================
           CONTENEDOR
           ============================== */

        .image-container {
            position: relative;
            width: 100%;
            line-height: 0;
        }

        /* ==============================
           IMÁGENES
           ============================== */

        .desktop-image,
        .mobile-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .mobile-image {
            display: none;
        }

        /* ==============================
           BOTÓN TRANSPARENTE
           DEL CORREO - COMPUTADORA
           ============================== */

        .email-link-desktop {
            position: absolute;

            left: 5%;
            bottom: 8%;

            width: 32%;
            height: 8%;

            display: block;

            text-decoration: none;

            z-index: 10;
        }

        /* ==============================
           CELULAR
           ============================== */

        @media screen and (max-width: 767px) {

            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
            }

            .email-link-desktop {
                display: none;
            }

            /* BOTÓN TRANSPARENTE DEL CORREO
               EN LA IMAGEN 1080 x 1350 */

            .email-link-mobile {
                position: absolute;

                left: 5%;
                bottom: 6%;

                width: 65%;
                height: 8%;

                display: block;

                text-decoration: none;

                z-index: 10;
            }
        }

        .email-link-mobile {
            display: none;
        }

        @media screen and (max-width: 767px) {

            .email-link-mobile {
                display: block;
            }

        }

    </style>

</head>


<body>


    <div class="image-container">

        <!-- ==============================
             COMPUTADORA
             ============================== -->

        <img
            class="desktop-image"
            src="IMAGEN WEB TEMPORAL.png"
            alt="GridVault - Energía Inteligente"
        >

        <!-- Enlace invisible sobre el correo -->

        <a
            class="email-link-desktop"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a GridVault"
        ></a>


        <!-- ==============================
             CELULAR
             ============================== -->

        <img
            class="mobile-image"
            src="IMAGEN WEB CELULAR.png"
            alt="GridVault - Energía Inteligente"
        >

        <!-- Enlace invisible sobre el correo -->

        <a
            class="email-link-mobile"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a GridVault"
        ></a>

    </div>


</body>

</html>
