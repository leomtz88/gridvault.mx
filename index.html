<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GridVault | Energía Inteligente</title>

    <style>

        /* ==============================
           CONFIGURACIÓN GENERAL
           ============================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        img {
            display: block;
        }


        /* ==============================
           COMPUTADORA
           ============================== */

        .desktop-image {
            width: 100%;
            height: auto;
            max-width: 100%;
        }


        /* ==============================
           CELULAR
           ============================== */

        .mobile-image {
            display: none;
            width: 100%;
            height: auto;
            max-width: 100%;
        }


        /* ==============================
           CELULARES
           ============================== */

        @media screen and (max-width: 767px) {

            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
                width: 100%;
                height: auto;
                max-width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         VERSIÓN COMPUTADORA
         ================================= -->

    <img
        class="desktop-image"
        src="IMAGEN WEB TEMPORAL.png"
        alt="GridVault - Energía Inteligente"
    >


    <!-- =================================
         VERSIÓN CELULAR
         ================================= -->

    <img
        class="mobile-image"
        src="IMAGEN WEB CELULAR.png"
        alt="GridVault - Energía Inteligente"
    >


</body>

</html>
