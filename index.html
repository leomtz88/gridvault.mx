<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GridVault | Energía Inteligente</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        /* =========================
           IMAGEN PRINCIPAL
           ========================= */

        .contenedor {
            width: 100%;
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        .imagen-web {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
        }

        /* =========================
           BOTÓN DE CORREO
           ========================= */

        .correo {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 15%;

            display: block;

            text-decoration: none;
            background: transparent;

            z-index: 10;
        }

        /* =========================
           COMPUTADORA
           ========================= */

        @media (min-width: 769px) {

            .correo {
                height: 13%;
            }

        }

        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 768px) {

            .contenedor {
                width: 100%;
            }

            .imagen-web {
                width: 100%;
                height: auto;
                object-fit: contain;
            }

        }

    </style>

</head>

<body>

    <div class="contenedor">

        <!--
        IMAGEN PARA COMPUTADORA
        -->
        <picture>

            <!-- Imagen vertical para celular -->
            <source
                media="(max-width: 768px)"
                srcset="IMAGEN WEB CELULAR.png">

            <!-- Imagen horizontal para computadora -->
            <img
                class="imagen-web"
                src="IMAGEN WEB TEMPORAL.png"
                alt="GridVault - Energía Inteligente">

        </picture>

        <!--
        ÁREA CLICABLE DEL CORREO
        -->
        <a
            class="correo"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a hola@gridvault.mx">
        </a>

    </div>

</body>

</html>
