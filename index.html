<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GridVault | Energía Inteligente</title>

    <style>

        /* =========================================
           CONFIGURACIÓN GENERAL
           ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        img {
            display: block;
        }


        /* =========================================
           CONTENEDOR PRINCIPAL
           ========================================= */

        .image-container {
            position: relative;
            width: 100%;
            max-width: 100%;
            line-height: 0;
        }


        /* =========================================
           IMAGEN COMPUTADORA
           ========================================= */

        .desktop-image {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
        }


        /* =========================================
           IMAGEN CELULAR
           ========================================= */

        .mobile-image {
            display: none;
            width: 100%;
            height: auto;
            max-width: 100%;
        }


        /* =========================================
           CORREO CLICKEABLE - COMPUTADORA
           ========================================= */

        .email-link-desktop {

            position: absolute;

            left: 5%;
            bottom: 8%;

            width: 32%;
            height: 8%;

            display: block;

            z-index: 10;

            text-decoration: none;

            cursor: pointer;
        }


        /* =========================================
           CELULAR
           ========================================= */

        @media screen and (max-width: 767px) {

            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
                width: 100%;
                height: auto;
                max-width: 100%;
            }

            .email-link-desktop {
                display: none;
            }

            /*
             * ÁREA CLICKEABLE DEL CORREO
             *
             * La imagen nueva es 1206 x 2622.
             */

            .email-link-mobile {

                position: absolute;

                left: 5%;

                bottom: 5%;

                width: 70%;

                height: 6%;

                display: block;

                z-index: 10;

                text-decoration: none;

                cursor: pointer;
            }

        }


        /* =========================================
           ENLACE CELULAR
           ========================================= */

        .email-link-mobile {
            display: none;
        }


        /* =========================================
           TABLETS
           ========================================= */

        @media screen and (min-width: 768px) and (max-width: 1024px) {

            .desktop-image {
                display: block;
                width: 100%;
                height: auto;
            }

            .mobile-image {
                display: none;
            }

        }

    </style>

</head>


<body>


    <div class="image-container">


        <!-- =====================================
             VERSIÓN COMPUTADORA
             ===================================== -->

        <img
            class="desktop-image"
            src="IMAGEN WEB TEMPORAL.png"
            alt="GridVault - Energía Inteligente"
        >


        <!-- =====================================
             CORREO COMPUTADORA
             ===================================== -->

        <a
            class="email-link-desktop"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a hola@gridvault.mx"
        ></a>


        <!-- =====================================
             VERSIÓN CELULAR
             1206 x 2622 px
             ===================================== -->

        <img
            class="mobile-image"
            src="IMAGEN WEB CELULAR.png"
            alt="GridVault - Energía Inteligente"
        >


        <!-- =====================================
             CORREO CELULAR
             ===================================== -->

        <a
            class="email-link-mobile"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a hola@gridvault.mx"
        ></a>


    </div>


</body>

</html>V
