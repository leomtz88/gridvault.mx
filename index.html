<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GridVault | Energía Inteligente</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        /* IMÁGENES */
        img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* =========================
           VERSIÓN CELULAR
           ========================= */

        .celular {
            display: none;
            width: 100%;
        }

        .celular a {
            display: block;
            width: 100%;
            text-decoration: none;
            cursor: pointer;
        }


        /* =========================
           VERSIÓN COMPUTADORA
           ========================= */

        .computadora {
            display: block;
            width: 100%;
        }

        .computadora a {
            display: block;
            width: 100%;
            text-decoration: none;
            cursor: pointer;
        }


        /* =========================
           CELULAR
           ========================= */

        @media screen and (max-width: 767px) {

            .computadora {
                display: none !important;
            }

            .celular {
                display: block !important;
                width: 100%;
            }

        }


        /* =========================
           COMPUTADORA
           ========================= */

        @media screen and (min-width: 768px) {

            .celular {
                display: none !important;
            }

            .computadora {
                display: block !important;
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         VERSIÓN CELULAR
         ========================= -->

    <div class="celular">

        <a href="mailto:hola@gridvault.mx">

            <img
                src="IMAGEN WEB CELULAR.png"
                alt="GridVault - Energía Inteligente"
            >

        </a>

    </div>



    <!-- =========================
         VERSIÓN COMPUTADORA
         ========================= -->

    <div class="computadora">

        <a href="mailto:hola@gridvault.mx">

            <img
                src="IMAGEN WEB TEMPORAL.png"
                alt="GridVault - Energía Inteligente"
            >

        </a>

    </div>


</body>

</html>
