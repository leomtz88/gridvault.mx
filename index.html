<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GridVault | Energía Inteligente</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #101827;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .desktop-image {
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center;
        }

        .mobile-image {
            display: none;
        }

        /* =========================================
           VERSIÓN CELULAR
           ========================================= */

        @media screen and (max-width: 767px) {

            html,
            body {
                width: 100%;
                height: 100%;
                background: #101827;
                overflow: hidden;
            }

            .desktop-image {
                display: none;
            }

            .mobile-image {
                display: block;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                object-position: center;
            }
        }

    </style>
</head>

<body>

    <!-- Imagen para computadora / tablet -->
    <img
        class="desktop-image"
        src="IMAGEN WEB TEMPORAL.png"
        alt="GridVault - Energía Inteligente"
    >

    <!-- Imagen para celular -->
    <img
        class="mobile-image"
        src="IMAGEN WEB CELULAR.png"
        alt="GridVault - Energía Inteligente"
    >

</body>
</html>
