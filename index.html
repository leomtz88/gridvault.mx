<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GridVault | Energía Inteligente</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        .contenedor {
            position: relative;
            width: 100%;
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        .imagen-web {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
            border: 0;
        }

        /* Área invisible sobre el correo */
        .correo {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 12%;

            display: block;

            background: transparent;
            text-decoration: none;

            z-index: 10;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <!-- IMAGEN VERTICAL -->
        <img
            class="imagen-web"
            src="IMAGEN%20WEB%20CELULAR.png"
            alt="GridVault - Energía Inteligente">

        <!-- CORREO CLICABLE -->
        <a
            class="correo"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a hola@gridvault.mx">
        </a>

    </div>

</body>

</html>
