<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>GridVault | Energía Inteligente</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            background: #101827;
        }

        body {
            overflow-x: hidden;
        }

        /* CONTENEDOR GENERAL */
        .pagina {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        /* IMAGEN */
        .imagen {
            display: block;
            width: 100%;
            height: auto;
        }

        /* =========================
           VERSIÓN CELULAR
           ========================= */

        .celular {
            display: none;
            position: relative;
            width: 100%;
        }

        /* BOTÓN INVISIBLE SOBRE EL CORREO */
        .correo-celular {
            position: absolute;
            display: block;

            /*
              Posición aproximada del botón
              de correo dentro de la imagen
              vertical 1206 x 2622
            */

            left: 8%;
            top: 68.5%;
            width: 48%;
            height: 5%;

            z-index: 20;

            background: transparent;

            text-decoration: none;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            pointer-events: auto;
        }


        /* =========================
           VERSIÓN COMPUTADORA
           ========================= */

        .computadora {
            display: block;
            position: relative;
            width: 100%;
        }

        .correo-computadora {
            position: absolute;

            left: 5%;
            bottom: 7%;

            width: 32%;
            height: 9%;

            z-index: 20;

            background: transparent;

            text-decoration: none;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;

            pointer-events: auto;
        }


        /* =========================
           CELULAR
           ========================= */

        @media screen and (max-width: 767px) {

            html,
            body {
                width: 100%;
                min-height: 100%;
                overflow-x: hidden;
            }

            .computadora {
                display: none !important;
            }

            .celular {
                display: block !important;
                width: 100%;
            }

            .imagen {
                width: 100%;
                height: auto;
                display: block;
            }

            .correo-celular {
                display: block;
            }
        }


        /* =========================
           TABLET / COMPUTADORA
           ========================= */

        @media screen and (min-width: 768px) {

            .celular {
                display: none !important;
            }

            .computadora {
                display: block !important;
                width: 100%;
            }

            .imagen {
                width: 100%;
                height: auto;
                display: block;
            }
        }

    </style>
</head>


<body>


    <!-- =================================
         VERSIÓN CELULAR
         ================================= -->

    <div class="celular">

        <img
            class="imagen"
            src="IMAGEN WEB CELULAR.png"
            alt="GridVault - Energía Inteligente"
        >

        <!-- ÁREA CLICABLE DEL CORREO -->
        <a
            class="correo-celular"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a GridVault"
        ></a>

    </div>



    <!-- =================================
         VERSIÓN COMPUTADORA
         ================================= -->

    <div class="computadora">

        <img
            class="imagen"
            src="IMAGEN WEB TEMPORAL.png"
            alt="GridVault - Energía Inteligente"
        >

        <!-- ÁREA CLICABLE DEL CORREO -->
        <a
            class="correo-computadora"
            href="mailto:hola@gridvault.mx"
            aria-label="Enviar correo a GridVault"
        ></a>

    </div>


</body>
</html>
